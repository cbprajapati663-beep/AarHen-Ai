name: Local Test Suite

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "test.js"
      - "core/**"
      - "engines/**"
      - "providers/**"
      - "skills/**"
      - ".github/workflows/local-test-suite.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "test.js"
      - "core/**"
      - "engines/**"
      - "providers/**"
      - "skills/**"
      - ".github/workflows/local-test-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-test-suite:
    name: Core and cancellation regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run core tests and cancellation regression
        run: npm run test:all
