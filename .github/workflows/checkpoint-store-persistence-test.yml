name: AarHen Checkpoint Store Persistence Test

on:
  push:
    paths:
      - "core/checkpointStore.js"
      - "tests/checkpoint-store-persistence.test.js"
      - ".github/workflows/checkpoint-store-persistence-test.yml"
  pull_request:
    paths:
      - "core/checkpointStore.js"
      - "tests/checkpoint-store-persistence.test.js"
      - ".github/workflows/checkpoint-store-persistence-test.yml"
  workflow_dispatch:

jobs:
  checkpoint-store-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test persistent checkpoint store
        run: node tests/checkpoint-store-persistence.test.js
