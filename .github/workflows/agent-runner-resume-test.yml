name: AarHen Agent Runner Resume Tests

on:
  push:
    branches: ["main"]
    paths:
      - "core/agentRunner.js"
      - "core/agentRunnerResume.test.js"
      - ".github/workflows/agent-runner-resume-test.yml"
  pull_request:
    paths:
      - "core/agentRunner.js"
      - "core/agentRunnerResume.test.js"
      - ".github/workflows/agent-runner-resume-test.yml"
  workflow_dispatch:

jobs:
  agent-runner-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: |
          node --check core/agentRunner.js
          node --check core/agentRunnerResume.test.js
      - name: Pause and resume regression tests
        run: node --test core/agentRunnerResume.test.js
