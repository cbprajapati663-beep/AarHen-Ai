      # ======================================================
      # RUNNER STATUS AFTER TESTS
      # ======================================================

      - name: Final Runner Status Test
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          const status =
            runner.getStatus();

          if (
            status.success !==
            true
          ) {
            throw new Error(
              "Final Agent Runner status failed."
            );
          }

          if (
            status.status !==
            "active"
          ) {
            throw new Error(
              "Agent Runner is not active."
            );
          }

          if (
            status.agentManager?.connected !==
            true
          ) {
            throw new Error(
              "Agent Manager connection was lost."
            );
          }

          if (
            status.skillExecutor?.connected !==
            true
          ) {
            throw new Error(
              "Skill Executor connection was lost."
            );
          }

          if (
            status.permissionSystem?.connected !==
            true
          ) {
            throw new Error(
              "Permission system connection was lost."
            );
          }

          console.log(
            "Final Agent Runner status test passed."
          );

          console.log(
            JSON.stringify(
              status,
              null,
              2
            )
          );

          console.log(
            "Note: custom actions are process-local and are intentionally not expected to persist between GitHub Actions steps."
          );

          NODE
