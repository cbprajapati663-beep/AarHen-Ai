name: AarHen Agent Runner Test

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  agent-runner-test:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: npm install


      # ======================================================
      # LOAD AGENT RUNNER
      # ======================================================

      - name: Load Agent Runner
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          if (!runner) {
            throw new Error(
              "core/agentRunner.js could not be loaded."
            );
          }

          if (
            runner.AGENT_RUNNER_VERSION !==
            "5.8.4"
          ) {
            throw new Error(
              "Agent Runner version mismatch."
            );
          }

          console.log(
            "Agent Runner loaded successfully."
          );

          console.log(
            "Version:",
            runner.AGENT_RUNNER_VERSION
          );

          NODE


      # ======================================================
      # STATUS TEST
      # ======================================================

      - name: Agent Runner Status Test
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          const status =
            runner.getStatus();

          if (!status) {
            throw new Error(
              "Agent Runner status missing."
            );
          }

          if (
            status.success !==
            true
          ) {
            throw new Error(
              "Agent Runner status is not healthy."
            );
          }

          if (
            status.status !==
            "active"
          ) {
            throw new Error(
              "Agent Runner is not active."
            );
          }

          if (
            status.agentManager?.connected !==
            true
          ) {
            throw new Error(
              "Agent Manager is not connected."
            );
          }

          if (
            status.skillExecutor?.connected !==
            true
          ) {
            throw new Error(
              "Skill Executor is not connected."
            );
          }

          if (
            status.permissionSystem?.connected !==
            true
          ) {
            throw new Error(
              "Permission system is not connected."
            );
          }

          console.log(
            "Agent Runner status test passed."
          );

          NODE


      # ======================================================
      # ACTION MAP TEST
      # ======================================================

      - name: Action Map Test
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          const map =
            runner.ACTION_MAP;

          if (!map) {
            throw new Error(
              "Action map is missing."
            );
          }

          const requiredActions = [

            "calculate",
            "search_knowledge",
            "read_public_information",
            "execute_external_code",
            "security_testing_against_external_target"

          ];

          for (
            const action of requiredActions
          ) {

            if (!map[action]) {
              throw new Error(
                "Required action mapping is missing: " +
                action
              );
            }

          }

          if (
            map.calculate.category !==
            "calculation"
          ) {
            throw new Error(
              "Calculate category mapping mismatch."
            );
          }

          if (
            map.search_knowledge.category !==
            "knowledge"
          ) {
            throw new Error(
              "Knowledge category mapping mismatch."
            );
          }

          console.log(
            "Action map test passed."
          );

          NODE


      # ======================================================
      # PERMISSION TEST
      # ======================================================

      - name: Permission Recheck Test
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          const safe =
            runner.resolvePermission({

              action:
                "calculate"

            });

          if (
            safe.policy !==
            "ALLOW"
          ) {
            throw new Error(
              "Calculate action should be allowed."
            );
          }

          const protectedAction =
            runner.resolvePermission({

              action:
                "send_message"

            });

          if (
            protectedAction.policy !==
            "ASK"
          ) {
            throw new Error(
              "Send-message action should require approval."
            );
          }

          if (
            protectedAction.requiresApproval !==
            true
          ) {
            throw new Error(
              "Approval requirement was not detected."
            );
          }

          console.log(
            "Permission recheck test passed."
          );

          NODE


      # ======================================================
      # EXECUTOR INTENT TEST
      # ======================================================

      - name: Executor Intent Mapping Test
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          const result =
            runner.buildExecutorIntent(

              {

                id:
                  "task-test",

                agentId:
                  "agent-test",

                request:
                  "Calculate 10 + 20"

              },

              {

                id:
                  "step-test",

                action:
                  "calculate",

                input: {

                  request:
                    "Calculate 10 + 20"

                }

              },

              {

                source:
                  "agent-runner-test"

              }

            );

          if (
            result.success !==
            true
          ) {
            throw new Error(
              "Executor intent creation failed."
            );
          }

          if (
            result.intentData.category !==
            "calculation"
          ) {
            throw new Error(
              "Executor intent category mismatch."
            );
          }

          if (
            result.intentData.intent !==
            "calculate"
          ) {
            throw new Error(
              "Executor intent mismatch."
            );
          }

          if (
            result.intentData.context.taskId !==
            "task-test"
          ) {
            throw new Error(
              "Task context was not preserved."
            );
          }

          if (
            result.intentData.context.agentId !==
            "agent-test"
          ) {
            throw new Error(
              "Agent context was not preserved."
            );
          }

          console.log(
            "Executor intent mapping test passed."
          );

          NODE


      # ======================================================
      # APPROVAL PROTECTION TEST
      # ======================================================

      - name: Approval Protection Test
        run: |
          node - <<'NODE'

          (async () => {

            const runner =
              require("./core/agentRunner");

            const task = {

              id:
                "approval-task",

              agentId:
                "approval-agent",

              request:
                "Send a message",

              context: {},

              stopRequested:
                false,

              pauseRequested:
                false

            };

            const step = {

              id:
                "approval-step",

              action:
                "send_message",

              approved:
                false,

              input: {}

            };

            const controlledRunner =
              runner.createRunner();

            const result =
              await controlledRunner({

                task,

                step,

                permission:
                  runner.resolvePermission(
                    step
                  )

              });

            if (
              result.success !==
              false
            ) {
              throw new Error(
                "Protected action executed without approval."
              );
            }

            if (
              result.requiresApproval !==
              true
            ) {
              throw new Error(
                "Approval requirement was not returned."
              );
            }

            if (
              result.executionStatus !==
              "approval-required"
            ) {
              throw new Error(
                "Unexpected approval protection status."
              );
            }

            console.log(
              "Approval protection test passed."
            );

          })().catch(error => {

            console.error(error);

            process.exit(1);

          });

          NODE


      # ======================================================
      # CONTROLLED CALCULATION EXECUTION TEST
      # ======================================================

      - name: Controlled Calculation Execution Test
        run: |
          node - <<'NODE'

          (async () => {

            const runner =
              require("./core/agentRunner");

            const task = {

              id:
                "calculation-task",

              agentId:
                "calculation-agent",

              request:
                "Calculate 10 + 20",

              context: {},

              stopRequested:
                false,

              pauseRequested:
                false

            };

            const step = {

              id:
                "calculation-step",

              action:
                "calculate",

              approved:
                true,

              input: {

                request:
                  "Calculate 10 + 20"

              }

            };

            const controlledRunner =
              runner.createRunner({

                source:
                  "agent-runner-test"

              });

            const result =
              await controlledRunner({

                task,

                step,

                permission:
                  runner.resolvePermission(
                    step
                  )

              });

            if (
              result.success !==
              true
            ) {
              throw new Error(
                "Controlled calculation execution failed: " +
                (
                  result.error ||
                  JSON.stringify(
                    result.result ||
                    {}
                  ) ||
                  "unknown error"
                )
              );
            }

            if (
              result.action !==
              "calculate"
            ) {
              throw new Error(
                "Executed action mismatch."
              );
            }

            if (
              !result.result
            ) {
              throw new Error(
                "Executor result is missing."
              );
            }

            console.log(
              "Controlled calculation execution test passed."
            );

          })().catch(error => {

            console.error(error);

            process.exit(1);

          });

          NODE


      # ======================================================
      # STOP PROTECTION TEST
      # ======================================================

      - name: Stop Protection Test
        run: |
          node - <<'NODE'

          (async () => {

            const runner =
              require("./core/agentRunner");

            const controlledRunner =
              runner.createRunner();

            const result =
              await controlledRunner({

                task: {

                  id:
                    "stop-task",

                  agentId:
                    "stop-agent",

                  stopRequested:
                    true,

                  pauseRequested:
                    false,

                  context: {}

                },

                step: {

                  id:
                    "stop-step",

                  action:
                    "calculate",

                  approved:
                    true

                },

                permission: {

                  policy:
                    "ALLOW"

                }

              });

            if (
              result.success !==
              false
            ) {
              throw new Error(
                "Stopped task was allowed to execute."
              );
            }

            if (
              result.stopped !==
              true
            ) {
              throw new Error(
                "Stopped state was not detected."
              );
            }

            if (
              result.executionStatus !==
              "task-stopped"
            ) {
              throw new Error(
                "Unexpected stopped execution status."
              );
            }

            console.log(
              "Stop protection test passed."
            );

          })().catch(error => {

            console.error(error);

            process.exit(1);

          });

          NODE


      # ======================================================
      # PAUSE PROTECTION TEST
      # ======================================================

      - name: Pause Protection Test
        run: |
          node - <<'NODE'

          (async () => {

            const runner =
              require("./core/agentRunner");

            const controlledRunner =
              runner.createRunner();

            const result =
              await controlledRunner({

                task: {

                  id:
                    "pause-task",

                  agentId:
                    "pause-agent",

                  stopRequested:
                    false,

                  pauseRequested:
                    true,

                  context: {}

                },

                step: {

                  id:
                    "pause-step",

                  action:
                    "calculate",

                  approved:
                    true

                },

                permission: {

                  policy:
                    "ALLOW"

                }

              });

            if (
              result.success !==
              false
            ) {
              throw new Error(
                "Paused task was allowed to execute."
              );
            }

            if (
              result.paused !==
              true
            ) {
              throw new Error(
                "Paused state was not detected."
              );
            }

            if (
              result.executionStatus !==
              "task-paused"
            ) {
              throw new Error(
                "Unexpected paused execution status."
              );
            }

            console.log(
              "Pause protection test passed."
            );

          })().catch(error => {

            console.error(error);

            process.exit(1);

          });

          NODE


      # ======================================================
      # CUSTOM ACTION PERMISSION TEST
      # ======================================================

      - name: Custom Action Permission Test
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          runner.reset();

          const registration =
            runner.registerAction(

              "test_custom_action",

              async () => ({

                success:
                  true,

                output:
                  "custom-test"

              }),

              {

                description:
                  "Agent Runner custom action test."

              }

            );

          if (
            registration.success !==
            true
          ) {
            throw new Error(
              "Custom action registration failed."
            );
          }

          if (
            registration.policy !==
            "ASK"
          ) {
            throw new Error(
              "Unknown custom action should require approval."
            );
          }

          if (
            registration.requiresApproval !==
            true
          ) {
            throw new Error(
              "Custom action approval requirement missing."
            );
          }

          const actions =
            runner.listActions();

          const found =
            actions.actions.find(
              item =>
                item.action ===
                "test_custom_action"
            );

          if (
            !found
          ) {
            throw new Error(
              "Registered custom action was not listed."
            );
          }

          console.log(
            "Custom action permission test passed."
          );

          NODE


      # ======================================================
      # FINAL RUNNER STATUS TEST
      # ======================================================

      - name: Final Runner Status Test
        run: |
          node - <<'NODE'

          const runner =
            require("./core/agentRunner");

          const status =
            runner.getStatus();

          if (
            status.success !==
            true
          ) {
            throw new Error(
              "Final Agent Runner status failed."
            );
          }

          if (
            status.status !==
            "active"
          ) {
            throw new Error(
              "Agent Runner is not active."
            );
          }

          if (
            status.agentManager?.connected !==
            true
          ) {
            throw new Error(
              "Agent Manager connection was lost."
            );
          }

          if (
            status.skillExecutor?.connected !==
            true
          ) {
            throw new Error(
              "Skill Executor connection was lost."
            );
          }

          if (
            status.permissionSystem?.connected !==
            true
          ) {
            throw new Error(
              "Permission system connection was lost."
            );
          }

          console.log(
            "Final Agent Runner status test passed."
          );

          console.log(
            JSON.stringify(
              status,
              null,
              2
            )
          );

          console.log(
            "Custom actions are process-local and are not expected to persist between separate GitHub Actions steps."
          );

          NODE


      # ======================================================
      # FINAL SUMMARY
      # ======================================================

      - name: Final Summary
        run: |
          echo ""
          echo "=============================================="
          echo " AARHEN AGENT RUNNER TEST"
          echo "=============================================="
          echo " Runner Load: PASSED"
          echo " Runner Status: PASSED"
          echo " Action Mapping: PASSED"
          echo " Permission Recheck: PASSED"
          echo " Executor Intent Mapping: PASSED"
          echo " Approval Protection: PASSED"
          echo " Controlled Calculation: PASSED"
          echo " Stop Protection: PASSED"
          echo " Pause Protection: PASSED"
          echo " Custom Action Safety: PASSED"
          echo " Final Status: PASSED"
          echo "=============================================="
          echo " AGENT RUNNER v5.8.4 READY"
          echo "=============================================="
