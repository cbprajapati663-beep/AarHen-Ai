name: AarHen Multilingual Language Engine Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  language-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run multilingual language engine tests
        run: node tests/language-engine.test.js
