name: AarHen Provider Manager Test

on:
  workflow_dispatch:
  push:
    paths:
      - "providers/providerManager.js"
      - "providers/researchProvider.js"
      - ".github/workflows/provider-manager-test.yml"

jobs:

  provider-manager-test:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # SETUP
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================
      # LOAD TEST
      # ======================================================

      - name: Provider Manager Load Test
        run: |

          node - <<'NODE'

          const manager =
            require("./providers/providerManager");

          if (!manager) {
            throw new Error(
              "Provider Manager could not be loaded."
            );
          }

          if (
            manager.PROVIDER_MANAGER_VERSION !==
            "5.9.0"
          ) {
            throw new Error(
              "Provider Manager version mismatch."
            );
          }

          console.log(
            "Provider Manager loaded successfully."
          );

          console.log(
            "Version:",
            manager.PROVIDER_MANAGER_VERSION
          );

          NODE


      # ======================================================
      # STATUS TEST
      # ======================================================

      - name: Provider Manager Status Test
        run: |

          node - <<'NODE'

          const manager =
            require("./providers/providerManager");

          const status =
            manager.getStatus();

          if (!status) {
            throw new Error(
              "Provider Manager status is missing."
            );
          }

          if (
            status.success !==
            true
          ) {
            throw new Error(
              "Provider Manager status is not healthy."
            );
          }

          if (
            status.status !==
            "active"
          ) {
            throw new Error(
              "Provider Manager is not active."
            );
          }

          if (
            status.version !==
            "5.9.0"
          ) {
            throw new Error(
              "Provider Manager status version mismatch."
            );
          }

          if (
            !Array.isArray(
              status.providers
            )
          ) {
            throw new Error(
              "Provider list is missing."
            );
          }

          console.log(
            "Provider Manager status test passed."
          );

          console.log(
            JSON.stringify(
              status,
              null,
              2
            )
          );

          NODE


      # ======================================================
      # BUILT-IN RESEARCH PROVIDER TEST
      # ======================================================

      - name: Built-in Research Provider Test
        run: |

          node - <<'NODE'

          const manager =
            require("./providers/providerManager");

          const provider =
            manager.getProvider(
              "research"
            );

          if (!provider) {
            throw new Error(
              "Built-in research provider is missing."
            );
          }

          if (
            typeof provider.search !==
            "function"
          ) {
            throw new Error(
              "Research provider search() is missing."
            );
          }

          if (
            typeof provider.getProviderStatus !==
            "function"
          ) {
            throw new Error(
              "Research provider getProviderStatus() is missing."
            );
          }

          const config =
            manager.getProviderConfig(
              "research"
            );

          if (!config) {
            throw new Error(
              "Research provider configuration is missing."
            );
          }

          if (
            config.enabled !==
            true
          ) {
            throw new Error(
              "Research provider should be enabled by default."
            );
          }

          if (
            config.providerType !==
            "web-search"
          ) {
            throw new Error(
              "Research provider type mismatch."
            );
          }

          console.log(
            "Built-in research provider test passed."
          );

          NODE


      # ======================================================
      # PROVIDER HEALTH TEST
      # ======================================================

      - name: Provider Health Test
        run: |

          node - <<'NODE'

          const manager =
            require("./providers/providerManager");

          const health =
            manager.getProviderHealth(
              "research"
            );

          if (!health) {
            throw new Error(
              "Research provider health result missing."
            );
          }

          if (
            health.provider !==
            "research"
          ) {
            throw new Error(
              "Provider health identity mismatch."
            );
          }

          if (
            health.exists !==
            true
          ) {
            throw new Error(
              "Research provider was not detected."
            );
          }

          if (
            health.enabled !==
            true
          ) {
            throw new Error(
              "Research provider is unexpectedly disabled."
            );
          }

          if (
            typeof health.connected !==
            "boolean"
          ) {
            throw new Error(
              "Provider connected state is missing."
            );
          }

          console.log(
            "Provider health test passed."
          );

          console.log(
            JSON.stringify(
              health,
              null,
              2
            )
          );

          NODE


      # ======================================================
      # DYNAMIC PROVIDER TEST
      # ======================================================
      #
      # IMPORTANT:
      # All registry-dependent dynamic-provider tests are
      # intentionally kept inside ONE Node process.
      # GitHub Actions does not preserve in-memory state
      # between separate `run` steps.
      # ======================================================

      - name: Dynamic Provider Integration Test
        run: |

          node - <<'NODE'

          (async () => {

            const manager =
              require(
                "./providers/providerManager"
              );


            // ------------------------------------------------
            // Mock Provider
            // ------------------------------------------------

            const mockProvider = {

              async search({
                query,
                maxSources
              } = {}) {

                const count =
                  Math.max(
                    1,
                    Math.min(
                      Number(
                        maxSources
                      ) || 1,
                      3
                    )
                  );

                return {

                  success:
                    true,

                  provider:
                    "Mock Search Provider",

                  query,

                  answer:
                    "Mock provider response.",

                  results:
                    Array.from(
                      {
                        length:
                          count
                      },
                      (
                        _,
                        index
                      ) => ({

                        title:
                          `Mock Result ${index + 1}`,

                        url:
                          `https://example.com/mock-${index + 1}`,

                        snippet:
                          "Mock research result."

                      })
                    ),

                  sourceCount:
                    count

                };

              },

              getProviderStatus() {

                return {

                  success:
                    true,

                  provider:
                    "Mock Search Provider",

                  connected:
                    true,

                  status:
                    "connected",

                  supportsSearch:
                    true,

                  supportsSourceValidation:
                    false,

                  supportsResultNormalization:
                    true,

                  providerType:
                    "web-search"

                };

              }

            };


            // ------------------------------------------------
            // Registration
            // ------------------------------------------------

            const registration =
              manager.registerProvider(

                "mock",

                mockProvider,

                {

                  priority:
                    20,

                  enabled:
                    true,

                  providerType:
                    "web-search"

                }

              );


            if (
              registration.success !==
              true
            ) {
              throw new Error(
                "Mock provider registration failed."
              );
            }


            if (
              registration.provider !==
              "mock"
            ) {
              throw new Error(
                "Registered provider identity mismatch."
              );
            }


            if (
              registration.enabled !==
              true
            ) {
              throw new Error(
                "Registered provider should be enabled."
              );
            }


            if (
              registration.priority !==
              20
            ) {
              throw new Error(
                "Registered provider priority mismatch."
              );
            }


            console.log(
              "Provider registration: PASSED"
            );


            // ------------------------------------------------
            // Provider Health
            // ------------------------------------------------

            const mockHealth =
              manager.getProviderHealth(
                "mock"
              );


            if (
              mockHealth.exists !==
              true
            ) {
              throw new Error(
                "Mock provider was not detected."
              );
            }


            if (
              mockHealth.enabled !==
              true
            ) {
              throw new Error(
                "Mock provider should be enabled."
              );
            }


            if (
              mockHealth.connected !==
              true
            ) {
              throw new Error(
                "Mock provider should be connected."
              );
            }


            console.log(
              "Dynamic provider health: PASSED"
            );


            // ------------------------------------------------
            // Explicit Selection
            // ------------------------------------------------

            const selected =
              manager.selectProvider(
                "mock"
              );


            if (
              selected.success !==
              true
            ) {
              throw new Error(
                "Mock provider selection failed."
              );
            }


            if (
              selected.selectedProvider !==
              "mock"
            ) {
              throw new Error(
                "Selected provider mismatch."
              );
            }


            if (
              selected.fallbackUsed !==
              false
            ) {
              throw new Error(
                "Explicit provider selection should not use fallback."
              );
            }


            console.log(
              "Explicit provider selection: PASSED"
            );


            // ------------------------------------------------
            // Automatic Selection
            // ------------------------------------------------

            const automatic =
              manager.selectProvider();


            if (
              automatic.success !==
              true
            ) {
              throw new Error(
                "Automatic provider selection failed."
              );
            }


            if (
              automatic.selectedProvider !==
              "mock"
            ) {
              throw new Error(
                "Automatic routing did not select the available highest-priority provider."
              );
            }


            console.log(
              "Automatic provider routing: PASSED"
            );


            // ------------------------------------------------
            // Web Search Gateway
            // ------------------------------------------------

            const searchResult =
              await manager.searchWeb({

                query:
                  "AarHen provider manager test",

                maxSources:
                  3,

                provider:
                  "mock"

              });


            if (
              searchResult.success !==
              true
            ) {
              throw new Error(
                "Mock web search failed: " +
                (
                  searchResult.error ||
                  "unknown error"
                )
              );
            }


            if (
              searchResult.provider !==
              "Mock Search Provider"
            ) {
              throw new Error(
                "Mock web search provider mismatch."
              );
            }


            if (
              !Array.isArray(
                searchResult.results
              )
            ) {
              throw new Error(
                "Mock search results are missing."
              );
            }


            if (
              searchResult.results.length !==
              3
            ) {
              throw new Error(
                "Mock search result count mismatch."
              );
            }


            if (
              !Array.isArray(
                searchResult.attemptedProviders
              )
            ) {
              throw new Error(
                "Attempted provider tracking is missing."
              );
            }


            if (
              !searchResult.attemptedProviders.includes(
                "mock"
              )
            ) {
              throw new Error(
                "Mock provider was not recorded in attempted providers."
              );
            }


            console.log(
              "Web search gateway: PASSED"
            );


            // ------------------------------------------------
            // Disable Provider
            // ------------------------------------------------

            const disabled =
              manager.setProviderEnabled(
                "mock",
                false
              );


            if (
              disabled.success !==
              true
            ) {
              throw new Error(
                "Provider disable operation failed."
              );
            }


            if (
              disabled.enabled !==
              false
            ) {
              throw new Error(
                "Provider was not disabled."
              );
            }


            if (
              manager.isProviderAvailable(
                "mock"
              ) !==
              false
            ) {
              throw new Error(
                "Disabled provider is incorrectly reported as available."
              );
            }


            console.log(
              "Provider disable safety: PASSED"
            );


            // ------------------------------------------------
            // Re-enable Provider
            // ------------------------------------------------

            const enabled =
              manager.setProviderEnabled(
                "mock",
                true
              );


            if (
              enabled.success !==
              true
            ) {
              throw new Error(
                "Provider enable operation failed."
              );
            }


            if (
              enabled.enabled !==
              true
            ) {
              throw new Error(
                "Provider was not enabled again."
              );
            }


            if (
              manager.isProviderAvailable(
                "mock"
              ) !==
              true
            ) {
              throw new Error(
                "Enabled connected provider is not available."
              );
            }


            console.log(
              "Provider enable safety: PASSED"
            );


            // ------------------------------------------------
            // Priority
            // ------------------------------------------------

            const priorityUpdate =
              manager.setProviderPriority(
                "mock",
                1
              );


            if (
              priorityUpdate.success !==
              true
            ) {
              throw new Error(
                "Provider priority update failed."
              );
            }


            if (
              priorityUpdate.priority !==
              1
            ) {
              throw new Error(
                "Provider priority was not updated."
              );
            }


            const prioritySelection =
              manager.selectProvider();


            if (
              prioritySelection.success !==
              true
            ) {
              throw new Error(
                "Provider selection after priority update failed."
              );
            }


            if (
              prioritySelection.selectedProvider !==
              "mock"
            ) {
              throw new Error(
                "Priority routing did not select mock provider."
              );
            }


            console.log(
              "Priority routing: PASSED"
            );


            // ------------------------------------------------
            // Failing Provider + Fallback
            // ------------------------------------------------

            const failingProvider = {

              async search() {

                return {

                  success:
                    false,

                  results:
                    [],

                  error:
                    "Intentional mock provider failure."

                };

              },


              getProviderStatus() {

                return {

                  success:
                    true,

                  provider:
                    "Failing Mock Provider",

                  connected:
                    true,

                  status:
                    "connected",

                  supportsSearch:
                    true,

                  providerType:
                    "web-search"

                };

              }

            };


            const failingRegistration =
              manager.registerProvider(

                "failing",

                failingProvider,

                {

                  priority:
                    0,

                  enabled:
                    true,

                  providerType:
                    "web-search"

                }

              );


            if (
              failingRegistration.success !==
              true
            ) {
              throw new Error(
                "Failing provider registration failed."
              );
            }


            const fallbackResult =
              await manager.searchWeb({

                query:
                  "Fallback test",

                maxSources:
                  2

              });


            if (
              fallbackResult.success !==
              true
            ) {
              throw new Error(
                "Provider fallback did not recover search: " +
                (
                  fallbackResult.error ||
                  "unknown error"
                )
              );
            }


            if (
              fallbackResult.provider !==
              "Mock Search Provider"
            ) {
              throw new Error(
                "Fallback provider was not selected."
              );
            }


            if (
              fallbackResult.fallbackUsed !==
              true
            ) {
              throw new Error(
                "Fallback flag was not enabled."
              );
            }


            if (
              !Array.isArray(
                fallbackResult.attemptedProviders
              )
            ) {
              throw new Error(
                "Fallback attempted provider tracking is missing."
              );
            }


            if (
              fallbackResult.attemptedProviders.length <
              2
            ) {
              throw new Error(
                "Fallback did not attempt multiple providers."
              );
            }


            if (
              fallbackResult.attemptedProviders[0] !==
              "failing"
            ) {
              throw new Error(
                "Failing provider was not attempted first."
              );
            }


            if (
              fallbackResult.attemptedProviders[1] !==
              "mock"
            ) {
              throw new Error(
                "Fallback provider order is incorrect."
              );
            }


            console.log(
              "Fallback routing: PASSED"
            );


            // ------------------------------------------------
            // Unknown Provider
            // ------------------------------------------------

            const unknown =
              await manager.searchWeb({

                query:
                  "Unknown provider test",

                provider:
                  "does-not-exist"

              });


            if (
              unknown.success !==
              false
            ) {
              throw new Error(
                "Unknown provider was incorrectly accepted."
              );
            }


            if (
              !unknown.error
            ) {
              throw new Error(
                "Unknown provider error message is missing."
              );
            }


            console.log(
              "Unknown provider safety: PASSED"
            );


            // ------------------------------------------------
            // Reset
            // ------------------------------------------------

            const reset =
              manager.reset();


            if (
              reset.success !==
              true
            ) {
              throw new Error(
                "Provider Manager reset failed."
              );
            }


            if (
              reset.version !==
              "5.9.0"
            ) {
              throw new Error(
                "Reset version mismatch."
              );
            }


            if (
              !manager.getProvider(
                "research"
              )
            ) {
              throw new Error(
                "Built-in research provider was removed by reset."
              );
            }


            if (
              manager.getProvider(
                "mock"
              ) !==
              null
            ) {
              throw new Error(
                "Dynamic mock provider was not removed by reset."
              );
            }


            if (
              manager.getProvider(
                "failing"
              ) !==
              null
            ) {
              throw new Error(
                "Dynamic failing provider was not removed by reset."
              );
            }


            console.log(
              "Provider Manager reset: PASSED"
            );


            // ------------------------------------------------
            // Final Status
            // ------------------------------------------------

            const finalStatus =
              manager.getStatus();


            if (
              finalStatus.success !==
              true
            ) {
              throw new Error(
                "Final Provider Manager status failed."
              );
            }


            if (
              finalStatus.version !==
              "5.9.0"
            ) {
              throw new Error(
                "Final version mismatch."
              );
            }


            if (
              finalStatus.status !==
              "active"
            ) {
              throw new Error(
                "Provider Manager is not active."
              );
            }


            console.log(
              "Final status: PASSED"
            );


            console.log(
              JSON.stringify(
                finalStatus,
                null,
                2
              )
            );


            // ------------------------------------------------
            // Summary
            // ------------------------------------------------

            console.log("");
            console.log(
              "=============================================="
            );
            console.log(
              " DYNAMIC PROVIDER TEST SUMMARY"
            );
            console.log(
              "=============================================="
            );
            console.log(
              " Registration: PASSED"
            );
            console.log(
              " Health: PASSED"
            );
            console.log(
              " Explicit Selection: PASSED"
            );
            console.log(
              " Automatic Routing: PASSED"
            );
            console.log(
              " Web Search Gateway: PASSED"
            );
            console.log(
              " Enable / Disable: PASSED"
            );
            console.log(
              " Priority Routing: PASSED"
            );
            console.log(
              " Fallback Routing: PASSED"
            );
            console.log(
              " Unknown Provider Safety: PASSED"
            );
            console.log(
              " Reset: PASSED"
            );
            console.log(
              "=============================================="
            );

          })().catch(error => {

            console.error("");
            console.error(
              "Provider Manager integration test failed."
            );
            console.error(error);

            process.exit(1);

          });

          NODE


      # ======================================================
      # FINAL SUMMARY
      # ======================================================

      - name: Final Summary
        run: |

          echo ""
          echo "=============================================="
          echo " AARHEN PROVIDER MANAGER TEST"
          echo "=============================================="
          echo " Load: PASSED"
          echo " Status: PASSED"
          echo " Built-in Provider: PASSED"
          echo " Health Check: PASSED"
          echo " Dynamic Provider Integration: PASSED"
          echo " Provider Registration: PASSED"
          echo " Provider Selection: PASSED"
          echo " Automatic Routing: PASSED"
          echo " Web Search Gateway: PASSED"
          echo " Enable / Disable: PASSED"
          echo " Priority Routing: PASSED"
          echo " Fallback Routing: PASSED"
          echo " Unknown Provider Safety: PASSED"
          echo " Reset: PASSED"
          echo " Final Status: PASSED"
          echo "=============================================="
          echo " PROVIDER MANAGER v5.9.0 READY"
          echo "=============================================="
