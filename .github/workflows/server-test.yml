name: AarHen Server Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  server-test:

    runs-on: ubuntu-latest

    steps:

      # ==============================================
      # CHECKOUT
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================================
      # NODE.JS
      # ==============================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==============================================
      # START SERVER
      # ==============================================

      - name: Start AarHen server
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node server.js > server.log 2>&1 &
          sleep 3

      # ==============================================
      # HEALTH
      # ==============================================

      - name: Test health endpoint
        run: |
          curl -f http://localhost:3000/

      # ==============================================
      # LEARNING STATUS
      # ==============================================

      - name: Test learning status
        run: |
          curl -f http://localhost:3000/learning-status

      # ==============================================
      # MEMORY STATUS
      # ==============================================

      - name: Test memory status
        run: |
          curl -f http://localhost:3000/memory-status

      # ==============================================
      # LEARN
      # ==============================================

      - name: Learn test knowledge
        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "title":"AarHen Automated Learning Test",
              "content":"AarHen automated learning loop test knowledge. This knowledge will be used for feedback and correction testing.",
              "category":"system-test",
              "source":"github-actions"
            }' \
            http://localhost:3000/learn)

          echo "$RESPONSE"

          MEMORY_ID=$(printf '%s' "$RESPONSE" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const json = JSON.parse(data);
              const id = json.result && json.result.memoryId;
              if (!id) {
                console.error("Memory ID not found.");
                process.exit(1);
              }
              console.log(id);
            });
          ')

          echo "MEMORY_ID=$MEMORY_ID" >> "$GITHUB_ENV"

          echo "Captured Memory ID:"
          echo "$MEMORY_ID"

      # ==============================================
      # VERIFY LEARNING
      # ==============================================

      - name: Verify learned knowledge
        run: |
          curl -f http://localhost:3000/learning

      # ==============================================
      # FEEDBACK
      # ==============================================

      - name: Test user feedback
        run: |

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"memoryId\":\"$MEMORY_ID\",
              \"feedback\":\"This knowledge was useful during the AarHen learning test.\",
              \"helpful\":true,
              \"reason\":\"Automated feedback test\"
            }" \
            http://localhost:3000/feedback

      # ==============================================
      # CORRECTION
      # ==============================================

      - name: Test knowledge correction
        run: |

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"memoryId\":\"$MEMORY_ID\",
              \"correction\":\"AarHen automated learning loop test knowledge was corrected successfully through user feedback.\",
              \"reason\":\"Automated correction test\"
            }" \
            http://localhost:3000/correct

      # ==============================================
      # LEARNING HISTORY
      # ==============================================

      - name: Test learning history
        run: |

          curl -fsS \
            "http://localhost:3000/learning-history?memoryId=$MEMORY_ID"

      # ==============================================
      # VERIFY CORRECTED MEMORY
      # ==============================================

      - name: Verify corrected memory
        run: |

          RESPONSE=$(curl -fsS \
            "http://localhost:3000/learning-history?memoryId=$MEMORY_ID")

          echo "$RESPONSE"

          printf '%s' "$RESPONSE" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {

              const json = JSON.parse(data);

              if (!json.success) {
                console.error("Learning history failed.");
                process.exit(1);
              }

              if (json.feedbackCount < 1) {
                console.error("Feedback was not recorded.");
                process.exit(1);
              }

              if (json.status !== "corrected") {
                console.error("Knowledge correction was not applied.");
                process.exit(1);
              }

              console.log("Feedback verified.");
              console.log("Correction verified.");
              console.log("Learning history verified.");
            });
          '

      # ==============================================
      # RAG RECALL AFTER CORRECTION
      # ==============================================

      - name: Test knowledge recall
        run: |

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "input":"AarHen automated learning loop test knowledge"
            }' \
            http://localhost:3000/ask

      # ==============================================
      # TAVILY WEB RESEARCH
      # ==============================================

      - name: Test Tavily Web Research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |

          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "input":"latest vehicle finance information search karo"
            }' \
            http://localhost:3000/ask

      # ==============================================
      # FINAL LEARNING STATUS
      # ==============================================

      - name: Verify final learning status
        run: |
          curl -f http://localhost:3000/learning-status

      # ==============================================
      # FINAL MEMORY
      # ==============================================

      - name: Verify final memory
        run: |
          curl -f http://localhost:3000/memory

      # ==============================================
      # SERVER LOG
      # ==============================================

      - name: Show server log
        if: always()
        run: |
          cat server.log
