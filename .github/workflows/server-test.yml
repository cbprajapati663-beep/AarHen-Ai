name: AarHen Server Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ======================================================
      # NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================
      # NPM CACHE
      # ======================================================

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: aarhen-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            aarhen-npm-${{ runner.os }}-


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          npm install \
            --no-audit \
            --no-fund \
            --prefer-offline


      # ======================================================
      # CHECK RESEARCH ENGINE
      # ======================================================

      - name: Verify Research Engine
        run: |

          echo "=========================================="
          echo "RESEARCH ENGINE CHECK"
          echo "=========================================="

          node - <<'NODE'

          const research =
              require("./engines/research");

          console.log(
              "Research Engine Version:",
              research.RESEARCH_VERSION
          );

          console.log(
              "Minimum Verified Sources:",
              research.MIN_VERIFIED_SOURCES
          );

          console.log(
              "Minimum Verified Confidence:",
              research.MIN_VERIFIED_CONFIDENCE
          );

          console.log(
              "Research Engine Status:"
          );

          console.log(
              JSON.stringify(
                  research.getResearchStatus(),
                  null,
                  2
              )
          );

          NODE


      # ======================================================
      # SYNTAX CHECK
      # ======================================================

      - name: Validate JavaScript syntax
        run: |

          echo "=========================================="
          echo "JAVASCRIPT SYNTAX CHECK"
          echo "=========================================="

          node --check engines/research.js

          node --check core/orchestrator.js

          node --check skills/executor.js

          node --check skills/handlers.js

          node --check providers/researchProvider.js

          node --check providers/providerManager.js

          echo "All selected JavaScript files are valid."


      # ======================================================
      # CORE TESTS
      # ======================================================

      - name: Run AarHen unit tests
        run: |

          echo "=========================================="
          echo "RUNNING AARHEN UNIT TESTS"
          echo "=========================================="

          node test.js


      # ======================================================
      # PROVIDER MANAGER ROUTING + FALLBACK REGRESSION TESTS
      # ======================================================

      - name: Test Provider Manager routing and fallback
        run: |
          node tests/provider-manager-input-guards.test.js
          node --test tests/provider-manager-routing.test.js


      # ======================================================
      # DIRECT ORCHESTRATOR RESEARCH TEST
      # ======================================================
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT call:
      #
      # /api/aarhen
      #
      # because the current server does not expose
      # that POST route.
      #
      # Direct orchestration avoids the unnecessary
      # HTTP hop and makes this test faster.
      # ======================================================

      - name: Test AarHen Research Directly
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NODE_ENV: test
        run: |

          echo "=========================================="
          echo "DIRECT AARHEN RESEARCH TEST"
          echo "=========================================="

          node - <<'NODE'

          (async () => {

              const orchestrator =
                  require("./core/orchestrator");

              const research =
                  require("./engines/research");

              const query =
                  "Research current auto financing trends in 2026 and verify the information using multiple sources.";

              console.log(
                  "Query:",
                  query
              );

              console.log(
                  "Loaded Research Engine:",
                  research.RESEARCH_VERSION
              );


              const result =
                  await orchestrator.process(
                      query,
                      {
                          maxResearchSources: 5,
                          researchLanguage: "auto"
                      }
                  );


              console.log(
                  "=========================================="
              );

              console.log(
                  "ORCHESTRATOR RESULT"
              );

              console.log(
                  "=========================================="
              );


              console.log(
                  "Overall status:",
                  result.status
              );


              const researchResult =
                  result.research ||
                  result.execution?.research ||
                  result.execution?.result ||
                  {};


              const sources =
                  Array.isArray(
                      researchResult.sources
                  )
                      ? researchResult.sources
                      : [];


              const sourceCount =
                  Number(
                      researchResult.sourceCount
                  ) ||
                  sources.length;


              console.log(
                  "Research success:",
                  researchResult.success
              );


              console.log(
                  "Research version:",
                  researchResult.version ||
                  researchResult.verification?.version ||
                  "not-exposed"
              );


              console.log(
                  "Source count:",
                  sourceCount
              );


              console.log(
                  "Confidence:",
                  researchResult.confidence
              );


              console.log(
                  "Verified:",
                  researchResult.verified
              );


              console.log(
                  "Verification status:",
                  researchResult.verificationStatus ||
                  researchResult.verification?.status
              );


              console.log(
                  "Research status:",
                  researchResult.researchStatus
              );


              console.log(
                  "Provider:",
                  researchResult.provider
              );


              console.log(
                  "Learning:"
              );


              console.log(
                  JSON.stringify(
                      researchResult.learning,
                      null,
                      2
                  )
              );


              console.log(
                  "=========================================="
              );

              console.log(
                  "VERIFICATION DETAILS"
              );

              console.log(
                  JSON.stringify(
                      researchResult.verification,
                      null,
                      2
                  )
              );


              console.log(
                  "=========================================="
              );

              console.log(
                  "SOURCE TITLES"
              );

              for (
                  const source of sources
              ) {

                  console.log(
                      "-",
                      source.title
                  );
              }


              /* ============================================
                 VALIDATION
              ============================================ */


              if (
                  result.success === false
              ) {

                  console.error(
                      "ERROR: Orchestrator returned success=false."
                  );

                  console.error(
                      JSON.stringify(
                          result,
                          null,
                          2
                      )
                  );

                  process.exit(1);
              }


              if (
                  researchResult.success === false
              ) {

                  console.error(
                      "ERROR: Research engine returned failure."
                  );

                  console.error(
                      JSON.stringify(
                          researchResult,
                          null,
                          2
                      )
                  );

                  process.exit(1);
              }


              if (
                  sourceCount < 2
              ) {

                  console.error(
                      "ERROR: Fewer than 2 research sources returned."
                  );

                  process.exit(1);
              }


              /*
               * Live web evidence can legitimately contain conflicting claims.
               * The CI test validates the verification decision rather than
               * requiring every changing real-world query to be verified.
               * Unverified results must remain explicitly unverified.
               */
              if (
                  researchResult.verified === true &&
                  Number(researchResult.confidence) < 0.80
              ) {
                  console.error(
                      "ERROR: Research marked verified below the confidence threshold."
                  );
                  process.exit(1);
              }

              if (
                  researchResult.verified !== true &&
                  !researchResult.verification
              ) {
                  console.error(
                      "ERROR: Unverified research did not include verification diagnostics."
                  );
                  process.exit(1);
              }

              console.log(
                  researchResult.verified === true
                      ? "RESEARCH VERIFICATION PASSED"
                      : "RESEARCH SAFELY FLAGGED FOR REVIEW"
              );

          })().catch(error => {

              console.error(
                  "=========================================="
              );

              console.error(
                  "DIRECT ORCHESTRATOR ERROR"
              );

              console.error(
                  "=========================================="
              );

              console.error(
                  error &&
                  error.stack
                      ? error.stack
                      : error
              );

              process.exit(1);
          });

          NODE


      # ======================================================
      # VERIFY + LEARN
      # ======================================================

      - name: Validate Verify and Learn
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NODE_ENV: test
        run: |

          echo "=========================================="
          echo "VERIFY + LEARN TEST"
          echo "=========================================="

          node - <<'NODE'

          (async () => {

              const orchestrator =
                  require("./core/orchestrator");


              const query =
                  "Research current auto financing trends in 2026 and learn only the verified information.";


              const result =
                  await orchestrator.process(
                      query,
                      {
                          maxResearchSources: 5,
                          researchLanguage: "auto"
                      }
                  );


              const research =
                  result.research ||
                  result.execution?.research ||
                  {};


              const learning =
                  research.learning ||
                  result.execution?.learning ||
                  null;


              console.log(
                  "Research success:",
                  research.success
              );


              console.log(
                  "Research status:",
                  research.researchStatus
              );


              console.log(
                  "Source count:",
                  research.sourceCount
              );


              console.log(
                  "Confidence:",
                  research.confidence
              );


              console.log(
                  "Verified:",
                  research.verified
              );


              console.log(
                  "Verification:"
              );


              console.log(
                  JSON.stringify(
                      research.verification,
                      null,
                      2
                  )
              );


              console.log(
                  "Learning:"
              );


              console.log(
                  JSON.stringify(
                      learning,
                      null,
                      2
                  )
              );


              console.log(
                  "=========================================="
              );


              if (
                  research.success === false
              ) {

                  console.error(
                      "ERROR: Research failed."
                  );

                  process.exit(1);
              }


              /*
               * Conflicting or low-confidence live research must not be
               * learned as verified knowledge. Accept that safe review path,
               * but fail if the engine learned unverified material.
               */
              if (research.verified !== true) {
                  if (learning && learning.learned === true) {
                      console.error(
                          "ERROR: Unverified research was learned."
                      );
                      process.exit(1);
                  }

                  console.log(
                      "VERIFY + LEARN SAFETY PASSED: unverified research was not learned."
                  );
                  return;
              }

              if (
                  Number(research.confidence) < 0.80
              ) {
                  console.error(
                      "ERROR: Research marked verified below the confidence threshold."
                  );
                  process.exit(1);
              }

              /*
               * When research is verified, learning output must exist.
               */
              if (!learning) {
                  console.error(
                      "ERROR: Verified research has no learning result."
                  );
                  process.exit(1);
              }


              console.log(
                  "Learning learned:",
                  learning.learned
              );


              console.log(
                  "Learning verified:",
                  learning.verified
              );


              console.log(
                  "Learning approved:",
                  learning.approved
              );


              console.log(
                  "Learning status:",
                  learning.status
              );


              console.log(
                  "Memory ID:",
                  learning.memoryId ||
                  "none"
              );


              /*
               * The research engine must never report
               * learning as successful unless its learning
               * engine actually reports success.
               */

              if (
                  learning.learned !== true
              ) {

                  console.error(
                      "ERROR: Verified research exists, but learning was not completed."
                  );

                  process.exit(1);
              }


              console.log(
                  "=========================================="
              );


              console.log(
                  "VERIFY + LEARN PASSED"
              );


              console.log(
                  "=========================================="

              );

          })().catch(error => {

              console.error(
                  error &&
                  error.stack
                      ? error.stack
                      : error
              );

              process.exit(1);
          });

          NODE


      # ======================================================
      # FINAL SUMMARY
      # ======================================================

      - name: AarHen test summary
        if: always()
        run: |

          echo
          echo "=========================================="
          echo "AARHEN TEST SUMMARY"
          echo "=========================================="

          echo "Research Engine:"
          node -e "
            const r=require('./engines/research');
            console.log(r.RESEARCH_VERSION);
          "

          echo
          echo "Node:"
          node --version

          echo
          echo "NPM:"
          npm --version

          echo
          echo "=========================================="
          echo "TEST WORKFLOW FINISHED"
          echo "=========================================="
