name: AarHen Server Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ======================================================
      # NPM CACHE
      # ======================================================
      #
      # IMPORTANT:
      # Do NOT use setup-node cache: npm here because
      # this repository currently has no package-lock.json.
      #
      # We cache npm's download cache manually instead.
      # ======================================================

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: aarhen-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            aarhen-npm-${{ runner.os }}-

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          npm install \
            --no-audit \
            --no-fund \
            --prefer-offline

      # ======================================================
      # RESEARCH ENGINE VERSION
      # ======================================================

      - name: Verify Research Engine
        run: |
          echo "=========================================="
          echo "VERIFYING RESEARCH ENGINE"
          echo "=========================================="

          node - <<'NODE'

          const research =
            require("./engines/research");

          console.log(
            "Research Engine Version:",
            research.RESEARCH_VERSION
          );

          console.log(
            "Minimum Verified Sources:",
            research.MIN_VERIFIED_SOURCES
          );

          console.log(
            "Minimum Verified Confidence:",
            research.MIN_VERIFIED_CONFIDENCE
          );

          console.log(
            "=========================================="
          );

          console.log(
            JSON.stringify(
              research.getResearchStatus(),
              null,
              2
            )
          );

          NODE

      # ======================================================
      # JAVASCRIPT SYNTAX CHECK
      # ======================================================

      - name: Validate JavaScript syntax
        run: |
          echo "=========================================="
          echo "VALIDATING JAVASCRIPT"
          echo "=========================================="

          node --check engines/research.js

          node --check core/orchestrator.js

          node --check skills/executor.js

          node --check skills/handlers.js

          node --check providers/researchProvider.js

          node --check providers/providerManager.js

          echo "JavaScript syntax validation PASSED."

      # ======================================================
      # CORE TESTS
      # ======================================================

      - name: Run AarHen tests
        run: |
          echo "=========================================="
          echo "RUNNING AARHEN TESTS"
          echo "=========================================="

          node test.js

      # ======================================================
      # START SERVER
      # ======================================================

      - name: Start server
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NODE_ENV: test
          PORT: 3000
        run: |
          echo "=========================================="
          echo "STARTING AARHEN SERVER"
          echo "=========================================="

          nohup node server.js > server.log 2>&1 &

          echo $! > server.pid

          echo "Server PID:"
          cat server.pid

          sleep 1

          echo "Initial server log:"
          cat server.log || true

      # ======================================================
      # WAIT FOR SERVER
      # ======================================================

      - name: Wait for server
        run: |
          echo "=========================================="
          echo "WAITING FOR SERVER"
          echo "=========================================="

          READY=false

          for i in $(seq 1 20); do

            if curl -sS \
              --max-time 3 \
              http://127.0.0.1:3000/ \
              > /dev/null 2>&1; then

              echo "Server is READY."

              READY=true

              break

            fi

            echo "Waiting for server... $i/20"

            sleep 1

          done

          if [ "$READY" != "true" ]; then

            echo "=========================================="
            echo "SERVER FAILED TO START"
            echo "=========================================="

            echo "Server log:"
            cat server.log || true

            exit 1

          fi

      # ======================================================
      # SERVER HEALTH
      # ======================================================

      - name: Server health check
        run: |
          echo "=========================================="
          echo "SERVER HEALTH CHECK"
          echo "=========================================="

          curl -sS \
            --max-time 10 \
            http://127.0.0.1:3000/ \
            || true

          echo

      # ======================================================
      # WEB RESEARCH TEST
      # ======================================================

      - name: Test AarHen web research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |

          echo "=========================================="
          echo "AARHEN WEB RESEARCH TEST"
          echo "=========================================="

          RESPONSE=$(curl -sS \
            --max-time 90 \
            -X POST \
            http://127.0.0.1:3000/api/aarhen \
            -H "Content-Type: application/json" \
            -d '{
              "message": "Research current auto financing trends in 2026 and verify the information using multiple sources."
            }')

          echo "=========================================="
          echo "RAW RESPONSE"
          echo "=========================================="

          echo "$RESPONSE"

          echo
          echo "=========================================="
          echo "VALIDATING RESEARCH"
          echo "=========================================="

          node - "$RESPONSE" <<'NODE'

          const raw =
            process.argv[2] || "";

          let data;

          try {

            data =
              JSON.parse(raw);

          } catch (error) {

            console.error(
              "ERROR: Response is not valid JSON."
            );

            console.error(raw);

            process.exit(1);
          }


          const research =

            data.research ||

            data.execution?.research ||

            data.result?.research ||

            data.execution?.result ||

            {};


          const sourceCount =

            Number(
              research.sourceCount
            ) ||

            (
              Array.isArray(
                research.sources
              )
                ? research.sources.length
                : 0
            );


          console.log(
            "Request status:",
            data.status
          );

          console.log(
            "Research success:",
            research.success
          );

          console.log(
            "Research engine version:",
            research.version ||

            research.verification?.version ||

            "not-exposed"
          );

          console.log(
            "Source count:",
            sourceCount
          );

          console.log(
            "Confidence:",
            research.confidence
          );

          console.log(
            "Verified:",
            research.verified
          );

          console.log(
            "Verification status:",
            research.verificationStatus ||

            research.verification?.status
          );

          console.log(
            "Research status:",
            research.researchStatus
          );

          console.log(
            "Provider:",
            research.provider
          );

          console.log(
            "Learning:",
            JSON.stringify(
              research.learning,
              null,
              2
            )
          );


          console.log(
            "=========================================="
          );

          console.log(
            "VERIFICATION DETAILS"
          );

          console.log(
            JSON.stringify(
              research.verification,
              null,
              2
            )
          );


          if (
            research.success === false
          ) {

            console.error(
              "ERROR: Research request failed."
            );

            process.exit(1);
          }


          if (
            sourceCount < 2
          ) {

            console.error(
              "ERROR: Fewer than 2 research sources returned."
            );

            process.exit(1);
          }


          if (
            research.verified !== true
          ) {

            console.error(
              "ERROR: Research was not verified."
            );

            console.error(
              "Full verification object:"
            );

            console.error(
              JSON.stringify(
                research.verification,
                null,
                2
              )
            );

            process.exit(1);
          }


          if (
            Number(
              research.confidence
            ) < 0.80
          ) {

            console.error(
              "ERROR: Confidence is below 0.80."
            );

            process.exit(1);
          }


          console.log(
            "Research verification PASSED."
          );

          NODE

      # ======================================================
      # VERIFY + LEARN
      # ======================================================

      - name: Validate verify and learn
        run: |

          echo "=========================================="
          echo "VALIDATING VERIFY + LEARN"
          echo "=========================================="

          RESPONSE=$(curl -sS \
            --max-time 90 \
            -X POST \
            http://127.0.0.1:3000/api/aarhen \
            -H "Content-Type: application/json" \
            -d '{
              "message": "Research current auto financing trends in 2026 and learn only the verified information."
            }')

          echo "=========================================="
          echo "VERIFY + LEARN RAW RESPONSE"
          echo "=========================================="

          echo "$RESPONSE"

          echo
          echo "=========================================="
          echo "VERIFY + LEARN VALIDATION"
          echo "=========================================="

          node - "$RESPONSE" <<'NODE'

          const raw =
            process.argv[2] || "";

          let data;

          try {

            data =
              JSON.parse(raw);

          } catch (error) {

            console.error(
              "ERROR: Invalid JSON response."
            );

            console.error(raw);

            process.exit(1);
          }


          const research =

            data.research ||

            data.execution?.research ||

            data.result?.research ||

            {};


          const learning =

            research.learning ||

            data.execution?.learning ||

            null;


          console.log(
            "Research success:",
            research.success
          );

          console.log(
            "Research status:",
            research.researchStatus
          );

          console.log(
            "Verified:",
            research.verified
          );

          console.log(
            "Confidence:",
            research.confidence
          );

          console.log(
            "Source count:",
            research.sourceCount
          );

          console.log(
            "Learning:"
          );

          console.log(
            JSON.stringify(
              learning,
              null,
              2
            )
          );


          if (
            research.verified !== true
          ) {

            console.error(
              "ERROR: Research verification failed."
            );

            process.exit(1);
          }


          if (
            Number(
              research.confidence
            ) < 0.80
          ) {

            console.error(
              "ERROR: Research confidence below 0.80."
            );

            process.exit(1);
          }


          /*
           * Learning is inspected separately.
           *
           * We do not pretend learning succeeded
           * when the learning engine reports failure.
           */

          if (
            learning
          ) {

            console.log(
              "Learning learned:",
              learning.learned
            );

            console.log(
              "Learning verified:",
              learning.verified
            );

            console.log(
              "Learning approved:",
              learning.approved
            );

            console.log(
              "Learning status:",
              learning.status
            );

            console.log(
              "Memory ID:",
              learning.memoryId ||
              "none"
            );
          }


          console.log(
            "VERIFY + LEARN VALIDATION PASSED."
          );

          NODE

      # ======================================================
      # SERVER LOGS
      # ======================================================

      - name: Show server logs
        if: always()
        run: |

          echo "=========================================="
          echo "AARHEN SERVER LOG"
          echo "=========================================="

          cat server.log || true

      # ======================================================
      # STOP SERVER
      # ======================================================

      - name: Stop server
        if: always()
        run: |

          if [ -f server.pid ]; then

            kill $(cat server.pid) 2>/dev/null || true

          fi

          echo "Server cleanup completed."
