name: AarHen Server Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  server-test:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ======================================================
      # NODE VERSION
      # ======================================================

      - name: Check Node.js
        run: |
          node --version
          npm --version


      # ======================================================
      # SYNTAX CHECK
      # ======================================================

      - name: Check server syntax
        run: |
          node --check server.js
          node --check core/brain.js
          node --check core/orchestrator.js
          node --check core/memory.js
          node --check core/memoryManager.js
          node --check core/memoryApi.js
          node --check core/memoryStore.js
          node --check core/learning.js
          node --check core/learningApi.js
          node --check core/verification.js
          node --check core/storage.js
          node --check core/storageProvider.js
          node --check core/memoryHistory.js
          node --check engines/knowledge.js
          node --check engines/research.js
          node --check providers/researchProvider.js
          node --check providers/providerManager.js
          node --check skills/executor.js
          node --check skills/router.js
          node --check skills/registry.js


      # ======================================================
      # MODULE LOAD TEST
      # ======================================================

      - name: Load AarHen modules
        run: |
          node -e "require('./server.js')"
        env:
          PORT: 3000


      # ======================================================
      # START SERVER
      # ======================================================

      - name: Start AarHen server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid


      # ======================================================
      # WAIT FOR SERVER
      # ======================================================

      - name: Wait for server
        run: |
          echo "Waiting for AarHen server..."

          for i in {1..30}
          do
            if curl -s http://127.0.0.1:3000/ > /dev/null
            then
              echo "AarHen server is ONLINE."
              exit 0
            fi

            echo "Waiting... $i/30"
            sleep 1
          done

          echo "Server failed to start."
          echo ""
          echo "===== SERVER LOG ====="
          cat server.log || true
          echo ""
          echo "===== PROCESS ====="
          ps aux | grep node || true

          exit 1


      # ======================================================
      # ROOT ENDPOINT
      # ======================================================

      - name: Test root endpoint
        run: |
          curl -f http://127.0.0.1:3000/


      # ======================================================
      # LEARNING STATUS
      # ======================================================

      - name: Test learning status
        run: |
          curl -f http://127.0.0.1:3000/learning-status


      # ======================================================
      # MEMORY STATUS
      # ======================================================

      - name: Test memory status
        run: |
          curl -f http://127.0.0.1:3000/memory-status


      # ======================================================
      # MEMORY HEALTH
      # ======================================================

      - name: Test memory health
        run: |
          curl -f http://127.0.0.1:3000/memory-health


      # ======================================================
      # LEARNING STATUS API
      # ======================================================

      - name: Test learning API
        run: |
          curl -f http://127.0.0.1:3000/learning


      # ======================================================
      # MEMORY API
      # ======================================================

      - name: Test memory API
        run: |
          curl -f http://127.0.0.1:3000/memory


      # ======================================================
      # MEMORY HISTORY
      # ======================================================

      - name: Test memory history
        run: |
          curl -f http://127.0.0.1:3000/memory-history


      # ======================================================
      # LEARNING HISTORY
      # ======================================================

      - name: Test learning history
        run: |
          curl -f http://127.0.0.1:3000/learning-history


      # ======================================================
      # ASK ENDPOINT
      # ======================================================

      - name: Test ask endpoint
        run: |
          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"input":"What is vehicle finance?","remember":false}' \
            http://127.0.0.1:3000/ask


      # ======================================================
      # LEARN ENDPOINT
      # ======================================================

      - name: Test learn endpoint
        run: |
          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "title":"AarHen CI Test Knowledge",
              "content":"AarHen automated CI test knowledge record.",
              "category":"system-test",
              "source":"github-actions",
              "approved":true
            }' \
            http://127.0.0.1:3000/learn


      # ======================================================
      # FEEDBACK ENDPOINT
      # ======================================================

      - name: Test feedback endpoint
        run: |
          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "memoryId":"test-memory",
              "helpful":true
            }' \
            http://127.0.0.1:3000/feedback || true


      # ======================================================
      # SERVER LOG
      # ======================================================

      - name: Show server log
        if: always()
        run: |
          echo "===== AARHEN SERVER LOG ====="
          cat server.log || true


      # ======================================================
      # STOP SERVER
      # ======================================================

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]
          then
            kill $(cat server.pid) || true
          fi
