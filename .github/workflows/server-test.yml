name: AarHen Server Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      # ======================================================
      # RESEARCH ENGINE DIAGNOSTIC
      # ======================================================

      - name: Verify Research Engine Version
        run: |
          echo "=========================================="
          echo "VERIFYING ACTIVE RESEARCH ENGINE"
          echo "=========================================="

          node - <<'NODE'
          const research = require("./engines/research");

          console.log(
            "Research Engine Version:",
            research.RESEARCH_VERSION
          );

          console.log(
            "Minimum Verified Sources:",
            research.MIN_VERIFIED_SOURCES
          );

          console.log(
            "Minimum Verified Confidence:",
            research.MIN_VERIFIED_CONFIDENCE
          );

          console.log(
            "Research Status:"
          );

          console.log(
            JSON.stringify(
              research.getResearchStatus(),
              null,
              2
            )
          );
          NODE

      # ======================================================
      # SYNTAX CHECK
      # ======================================================

      - name: Validate JavaScript syntax
        run: |
          echo "=========================================="
          echo "VALIDATING JAVASCRIPT"
          echo "=========================================="

          node --check engines/research.js
          node --check core/orchestrator.js
          node --check skills/executor.js
          node --check skills/handlers.js
          node --check providers/researchProvider.js
          node --check providers/providerManager.js

          echo "JavaScript syntax validation passed."

      # ======================================================
      # UNIT TESTS
      # ======================================================

      - name: Run AarHen tests
        run: |
          echo "=========================================="
          echo "RUNNING AARHEN TESTS"
          echo "=========================================="

          node test.js

      # ======================================================
      # START SERVER
      # ======================================================

      - name: Start server
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NODE_ENV: test
          PORT: 3000
        run: |
          echo "=========================================="
          echo "STARTING AARHEN SERVER"
          echo "=========================================="

          nohup node server.js > server.log 2>&1 &

          echo $! > server.pid

          echo "Server PID:"
          cat server.pid

      # ======================================================
      # WAIT FOR SERVER
      # ======================================================

      - name: Wait for server
        run: |
          echo "=========================================="
          echo "WAITING FOR SERVER"
          echo "=========================================="

          for i in $(seq 1 30); do

            if curl -s http://127.0.0.1:3000/ > /dev/null 2>&1; then

              echo "Server is ready."
              exit 0

            fi

            echo "Waiting... attempt $i/30"

            sleep 1

          done

          echo "=========================================="
          echo "SERVER FAILED TO START"
          echo "=========================================="

          cat server.log || true

          exit 1

      # ======================================================
      # SERVER HEALTH
      # ======================================================

      - name: Server health check
        run: |
          echo "=========================================="
          echo "SERVER HEALTH"
          echo "=========================================="

          curl -sS \
            --max-time 20 \
            http://127.0.0.1:3000/ \
            || true

          echo

      # ======================================================
      # RESEARCH TEST
      # ======================================================

      - name: Test AarHen web research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |

          echo "=========================================="
          echo "AARHEN WEB RESEARCH TEST"
          echo "=========================================="

          RESPONSE=$(curl -sS \
            --max-time 90 \
            -X POST \
            http://127.0.0.1:3000/api/aarhen \
            -H "Content-Type: application/json" \
            -d '{
              "message": "Research current auto financing trends in 2026 and verify the information using multiple sources."
            }')

          echo "=========================================="
          echo "RAW RESPONSE"
          echo "=========================================="

          echo "$RESPONSE"

          echo
          echo "=========================================="
          echo "VALIDATING RESEARCH RESPONSE"
          echo "=========================================="

          node - "$RESPONSE" <<'NODE'

          const raw =
            process.argv[2] || "";

          let data;

          try {

            data =
              JSON.parse(raw);

          } catch (error) {

            console.error(
              "ERROR: Response is not valid JSON."
            );

            console.error(
              raw
            );

            process.exit(1);
          }


          const research =
            data.research ||
            data.execution?.research ||
            data.result?.research ||
            {};


          console.log(
            "Request status:",
            data.status
          );

          console.log(
            "Research success:",
            research.success
          );

          console.log(
            "Research engine version:",
            research.version ||
            research.verification?.version ||
            "not-exposed"
          );

          console.log(
            "Source count:",
            research.sourceCount ||
            research.sources?.length ||
            0
          );

          console.log(
            "Confidence:",
            research.confidence
          );

          console.log(
            "Verified:",
            research.verified
          );

          console.log(
            "Verification status:",
            research.verificationStatus ||
            research.verification?.status
          );

          console.log(
            "Research status:",
            research.researchStatus
          );

          console.log(
            "Learning:",
            JSON.stringify(
              research.learning,
              null,
              2
            )
          );


          /*
           * Diagnostic validation
           */

          if (
            !research ||
            research.success === false
          ) {

            console.error(
              "ERROR: AarHen research request failed."
            );

            process.exit(1);
          }


          const sourceCount =
            Number(
              research.sourceCount
            ) ||
            (
              Array.isArray(
                research.sources
              )
                ? research.sources.length
                : 0
            );


          if (
            sourceCount < 2
          ) {

            console.error(
              "ERROR: Research returned fewer than 2 sources."
            );

            process.exit(1);
          }


          if (
            research.verified !== true
          ) {

            console.error(
              "ERROR: Research was not verified."
            );

            console.error(
              "Verification object:",
              JSON.stringify(
                research.verification,
                null,
                2
              )
            );

            console.error(
              "Source count:",
              sourceCount
            );

            console.error(
              "Confidence:",
              research.confidence
            );

            process.exit(1);
          }


          if (
            Number(
              research.confidence
            ) < 0.80
          ) {

            console.error(
              "ERROR: Verified confidence is below 0.80."
            );

            process.exit(1);
          }


          console.log(
            "Research verification PASSED."
          );

          NODE

      # ======================================================
      # VERIFY + LEARN
      # ======================================================

      - name: Validate verify and learn
        run: |

          echo "=========================================="
          echo "VALIDATING VERIFY + LEARN"
          echo "=========================================="

          RESPONSE=$(curl -sS \
            --max-time 90 \
            -X POST \
            http://127.0.0.1:3000/api/aarhen \
            -H "Content-Type: application/json" \
            -d '{
              "message": "Research current auto financing trends in 2026 and learn only the verified information."
            }')

          echo "$RESPONSE"

          node - "$RESPONSE" <<'NODE'

          const raw =
            process.argv[2] || "";

          let data;

          try {

            data =
              JSON.parse(raw);

          } catch {

            console.error(
              "Invalid JSON response."
            );

            process.exit(1);
          }


          const research =
            data.research ||
            data.execution?.research ||
            data.result?.research ||
            {};


          const learning =
            research.learning ||
            data.execution?.learning ||
            null;


          console.log(
            "Research success:",
            research.success
          );

          console.log(
            "Research status:",
            research.researchStatus
          );

          console.log(
            "Verified:",
            research.verified
          );

          console.log(
            "Confidence:",
            research.confidence
          );

          console.log(
            "Learning object:",
            JSON.stringify(
              learning,
              null,
              2
            )
          );


          if (
            research.verified !== true
          ) {

            console.error(
              "ERROR: Research verification failed."
            );

            process.exit(1);
          }


          if (
            Number(
              research.confidence
            ) < 0.80
          ) {

            console.error(
              "ERROR: Research confidence below 0.80."
            );

            process.exit(1);
          }


          /*
           * Learning may legitimately fail if
           * the learning engine is unavailable,
           * so we expose the diagnostic result
           * rather than hiding it.
           */

          if (
            learning
          ) {

            console.log(
              "Learning present."
            );

            console.log(
              "Learning learned:",
              learning.learned
            );

            console.log(
              "Learning verified:",
              learning.verified
            );

            console.log(
              "Learning approved:",
              learning.approved
            );

            console.log(
              "Learning status:",
              learning.status
            );

            console.log(
              "Memory ID:",
              learning.memoryId ||
              "none"
            );
          }

          console.log(
            "VERIFY + LEARN VALIDATION PASSED."
          );

          NODE

      # ======================================================
      # SERVER LOGS
      # ======================================================

      - name: Show server logs
        if: always()
        run: |
          echo "=========================================="
          echo "AARHEN SERVER LOG"
          echo "=========================================="

          cat server.log || true
