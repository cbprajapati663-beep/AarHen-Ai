name: AarHen Server Test

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  server-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start AarHen server
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node server.js > server.log 2>&1 &
          sleep 3

      - name: Test health endpoint
        run: |
          curl -f http://localhost:3000/

      - name: Test learning status
        run: |
          curl -f http://localhost:3000/learning-status

      - name: Test memory endpoint
        run: |
          curl -f http://localhost:3000/memory

      - name: Test learning API
        run: |
          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"title":"AarHen Test Knowledge","content":"AarHen continuous learning system test knowledge.","category":"system-test","source":"github-actions"}' \
            http://localhost:3000/learn

      - name: Verify learned knowledge
        run: |
          curl -f http://localhost:3000/learning

      - name: Test Tavily Web Research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"input":"latest vehicle finance information search karo"}' \
            http://localhost:3000/ask

      - name: Show server log
        if: always()
        run: |
          cat server.log
