name: AarHen Server Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  server-test:

    runs-on: ubuntu-latest

    steps:

      # ==============================================
      # CHECKOUT
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================================
      # NODE.JS
      # ==============================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==============================================
      # START SERVER
      # ==============================================

      - name: Start AarHen server
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node server.js > server.log 2>&1 &
          sleep 3

      # ==============================================
      # HEALTH TEST
      # ==============================================

      - name: Test health endpoint
        run: |
          curl -f http://localhost:3000/

      # ==============================================
      # LEARNING STATUS
      # ==============================================

      - name: Test learning status
        run: |
          curl -f http://localhost:3000/learning-status

      # ==============================================
      # MEMORY STATUS
      # ==============================================

      - name: Test memory status
        run: |
          curl -f http://localhost:3000/memory-status

      # ==============================================
      # LEARN KNOWLEDGE
      # ==============================================

      - name: Test learning API
        run: |
          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "title":"AarHen Learning Test",
              "content":"AarHen continuous learning system test knowledge for end-to-end verification.",
              "category":"system-test",
              "source":"github-actions"
            }' \
            http://localhost:3000/learn

      # ==============================================
      # VERIFY KNOWLEDGE STORAGE
      # ==============================================

      - name: Verify learned knowledge
        run: |
          curl -f http://localhost:3000/learning

      # ==============================================
      # VERIFY MEMORY STORAGE
      # ==============================================

      - name: Verify memory endpoint
        run: |
          curl -f http://localhost:3000/memory

      # ==============================================
      # WEB RESEARCH
      # ==============================================

      - name: Test Tavily Web Research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          curl -f \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "input":"latest vehicle finance information search karo"
            }' \
            http://localhost:3000/ask

      # ==============================================
      # FINAL LEARNING STATUS
      # ==============================================

      - name: Verify final learning status
        run: |
          curl -f http://localhost:3000/learning-status

      # ==============================================
      # SERVER LOG
      # ==============================================

      - name: Show server log
        if: always()
        run: |
          cat server.log
