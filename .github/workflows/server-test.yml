name: AarHen Server Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # ==============================================
      # CHECKOUT
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================================
      # NODE.JS
      # ==============================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ==============================================
      # CHECK SERVER SYNTAX
      # ==============================================

      - name: Check server syntax
        run: |
          node --check server.js


      # ==============================================
      # CHECK LEARNING SYNTAX
      # ==============================================

      - name: Check learning engine syntax
        run: |
          node --check core/learning.js


      # ==============================================
      # CHECK REQUIRED MODULES
      # ==============================================

      - name: Check AarHen modules
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node - <<'NODE'
          console.log("Loading AarHen modules...");

          require("./core/memory");
          console.log("OK: memory");

          require("./core/memoryManager");
          console.log("OK: memoryManager");

          require("./core/verification");
          console.log("OK: verification");

          require("./core/memoryStore");
          console.log("OK: memoryStore");

          require("./core/learning");
          console.log("OK: learning");

          require("./core/learningApi");
          console.log("OK: learningApi");

          require("./core/memoryApi");
          console.log("OK: memoryApi");

          require("./core/orchestrator");
          console.log("OK: orchestrator");

          require("./server");
          console.log("OK: server module loaded");

          setTimeout(() => {
            process.exit(0);
          }, 1000);
          NODE


      # ==============================================
      # START SERVER
      # ==============================================

      - name: Start AarHen server
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

          echo "Server PID:"
          cat server.pid

          echo "Waiting for server..."

          for i in {1..15}
          do
            if curl -s http://localhost:3000/ > /tmp/health.json
            then
              echo "Server is ONLINE."
              cat /tmp/health.json
              break
            fi

            echo "Waiting... attempt $i"
            sleep 1
          done


      # ==============================================
      # SHOW SERVER LOG IF START FAILED
      # ==============================================

      - name: Check server startup
        run: |
          if ! curl -fsS http://localhost:3000/ > /tmp/health.json
          then
            echo ""
            echo "=============================================="
            echo "SERVER FAILED TO START"
            echo "=============================================="
            echo ""

            echo "SERVER LOG:"
            cat server.log || true

            echo ""
            echo "PROCESS STATUS:"
            ps aux | grep node || true

            exit 1
          fi

          echo "SERVER HEALTH:"
          cat /tmp/health.json


      # ==============================================
      # LEARNING STATUS
      # ==============================================

      - name: Test learning status
        run: |
          curl -fsS http://localhost:3000/learning-status


      # ==============================================
      # MEMORY STATUS
      # ==============================================

      - name: Test memory status
        run: |
          curl -fsS http://localhost:3000/memory-status


      # ==============================================
      # LEARN
      # ==============================================

      - name: Test learning
        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "title":"AarHen Automated Learning Test",
              "content":"AarHen automated learning loop test knowledge. This knowledge will be used for feedback and correction testing.",
              "category":"system-test",
              "source":"github-actions"
            }' \
            http://localhost:3000/learn)

          echo "$RESPONSE"

          MEMORY_ID=$(printf '%s' "$RESPONSE" | node -e '
            let data = "";

            process.stdin.on("data", chunk => {
              data += chunk;
            });

            process.stdin.on("end", () => {

              const json =
                JSON.parse(data);

              const result =
                json.result || json;

              const id =
                result.memoryId;

              if (!id) {
                console.error(
                  "Memory ID not found."
                );

                process.exit(1);
              }

              console.log(id);
            });
          ')

          echo "MEMORY_ID=$MEMORY_ID" >> "$GITHUB_ENV"

          echo ""
          echo "Captured Memory ID:"
          echo "$MEMORY_ID"


      # ==============================================
      # VERIFY LEARNING
      # ==============================================

      - name: Verify learning
        run: |
          curl -fsS http://localhost:3000/learning


      # ==============================================
      # FEEDBACK
      # ==============================================

      - name: Test feedback
        run: |

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"memoryId\":\"$MEMORY_ID\",
              \"feedback\":\"This knowledge was useful during the AarHen learning test.\",
              \"helpful\":true,
              \"reason\":\"Automated feedback test\"
            }" \
            http://localhost:3000/feedback


      # ==============================================
      # CORRECTION
      # ==============================================

      - name: Test correction
        run: |

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"memoryId\":\"$MEMORY_ID\",
              \"correction\":\"AarHen automated learning loop test knowledge was corrected successfully through user feedback.\",
              \"reason\":\"Automated correction test\"
            }" \
            http://localhost:3000/correct


      # ==============================================
      # LEARNING HISTORY
      # ==============================================

      - name: Test learning history
        run: |

          curl -fsS \
            "http://localhost:3000/learning-history?memoryId=$MEMORY_ID"


      # ==============================================
      # KNOWLEDGE RECALL
      # ==============================================

      - name: Test knowledge recall
        run: |

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "input":"AarHen automated learning loop test knowledge"
            }' \
            http://localhost:3000/ask


      # ==============================================
      # WEB RESEARCH
      # ==============================================

      - name: Test Tavily research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "input":"latest vehicle finance information search karo"
            }' \
            http://localhost:3000/ask


      # ==============================================
      # FINAL LEARNING STATUS
      # ==============================================

      - name: Final learning status
        run: |
          curl -fsS \
            http://localhost:3000/learning-status


      # ==============================================
      # FINAL MEMORY
      # ==============================================

      - name: Final memory
        run: |
          curl -fsS \
            http://localhost:3000/memory


      # ==============================================
      # ALWAYS SHOW SERVER LOG
      # ==============================================

      - name: Show server log
        if: always()
        run: |

          echo ""
          echo "=============================================="
          echo "AARHEN SERVER LOG"
          echo "=============================================="

          cat server.log || true

          echo ""
          echo "=============================================="
          echo "NODE PROCESSES"
          echo "=============================================="

          ps aux | grep node || true
