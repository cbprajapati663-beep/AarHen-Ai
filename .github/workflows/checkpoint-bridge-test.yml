name: AarHen Checkpoint Bridge Test

on:

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  checkpoint-bridge-test:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: npm install


      # ======================================================
      # COMPLETE CHECKPOINT BRIDGE TEST
      # ======================================================

      - name: Run Complete Checkpoint Bridge Test
        run: |

          node --input-type=commonjs - <<'NODE'

          (async () => {

            // =================================================
            // LOAD CORE MODULES
            // =================================================

            const checkpointEngine =
              require("./core/checkpointEngine");

            const checkpointBridge =
              require("./core/checkpointBridge");

            const agentManager =
              require("./core/agentManager");


            // =================================================
            // VERSION TEST
            // =================================================

            if (
              checkpointEngine.CHECKPOINT_ENGINE_VERSION !==
              "5.13.0"
            ) {

              throw new Error(
                "Checkpoint Engine version mismatch: " +
                checkpointEngine.CHECKPOINT_ENGINE_VERSION
              );

            }


            if (
              checkpointBridge.CHECKPOINT_BRIDGE_VERSION !==
              "5.13.1"
            ) {

              throw new Error(
                "Checkpoint Bridge version mismatch: " +
                checkpointBridge.CHECKPOINT_BRIDGE_VERSION
              );

            }


            console.log(
              "Checkpoint Engine:",
              checkpointEngine.CHECKPOINT_ENGINE_VERSION
            );


            console.log(
              "Checkpoint Bridge:",
              checkpointBridge.CHECKPOINT_BRIDGE_VERSION
            );


            // =================================================
            // RESET
            // =================================================

            checkpointEngine.reset();

            agentManager.reset();


            console.log(
              "Initial reset completed."
            );


            // =================================================
            // BRIDGE STATUS
            // =================================================

            const status =
              checkpointBridge.getStatus();


            if (
              status.success !==
              true
            ) {

              throw new Error(
                "Checkpoint Bridge status is unhealthy."
              );

            }


            if (
              status.status !==
              "active"
            ) {

              throw new Error(
                "Checkpoint Bridge is not active."
              );

            }


            if (
              status.version !==
              "5.13.1"
            ) {

              throw new Error(
                "Checkpoint Bridge status version mismatch."
              );

            }


            if (
              status.agentManager?.connected !==
              true
            ) {

              throw new Error(
                "Checkpoint Bridge is not connected to Agent Manager."
              );

            }


            if (
              status.agentManager?.version !==
              "5.8.0"
            ) {

              throw new Error(
                "Agent Manager version mismatch."
              );

            }


            if (
              status.checkpointEngine?.connected !==
              true
            ) {

              throw new Error(
                "Checkpoint Bridge is not connected to Checkpoint Engine."
              );

            }


            if (
              status.checkpointEngine?.version !==
              "5.13.0"
            ) {

              throw new Error(
                "Checkpoint Engine connection version mismatch."
              );

            }


            console.log(
              "Bridge status test passed."
            );


            // =================================================
            // CREATE TEST AGENT
            // =================================================

            const agentResult =
              agentManager.createAgent({

                id:
                  "checkpoint-test-agent",

                name:
                  "Checkpoint Test Agent",

                description:
                  "Checkpoint Bridge integration test agent.",

                type:
                  "general",

                owner:
                  "user",

                default:
                  true

              });


            if (
              agentResult.success !==
              true
            ) {

              throw new Error(
                "Checkpoint test agent creation failed: " +
                JSON.stringify(agentResult)
              );

            }


            if (
              agentResult.agent?.id !==
              "checkpoint-test-agent"
            ) {

              throw new Error(
                "Checkpoint test agent ID mismatch."
              );

            }


            console.log(
              "Test agent created successfully."
            );


            // =================================================
            // VERIFY AGENT
            // =================================================

            const loadedAgent =
              agentManager.getAgent(
                "checkpoint-test-agent"
              );


            if (
              loadedAgent.success !==
              true
            ) {

              throw new Error(
                "Created agent could not be loaded."
              );

            }


            if (
              loadedAgent.agent?.id !==
              "checkpoint-test-agent"
            ) {

              throw new Error(
                "Loaded agent ID mismatch."
              );

            }


            // =================================================
            // CREATE TEST TASK
            // =================================================

            const taskResult =
              agentManager.createTask(

                "checkpoint-test-agent",

                "Run two controlled calculation steps.",

                {

                  id:
                    "checkpoint-test-task",

                  description:
                    "Checkpoint Bridge integration test task.",

                  maxRetries:
                    2,

                  autonomy:
                    true

                }

              );


            if (
              taskResult.success !==
              true
            ) {

              throw new Error(
                "Checkpoint test task creation failed: " +
                JSON.stringify(taskResult)
              );

            }


            if (
              taskResult.task?.id !==
              "checkpoint-test-task"
            ) {

              throw new Error(
                "Checkpoint test task ID mismatch."
              );

            }


            if (
              taskResult.task?.agentId !==
              "checkpoint-test-agent"
            ) {

              throw new Error(
                "Checkpoint test task agent ID mismatch."
              );

            }


            console.log(
              "Test task created successfully."
            );


            // =================================================
            // ADD STEP 1
            // =================================================

            const stepOne =
              agentManager.addStep(

                "checkpoint-test-task",

                {

                  id:
                    "checkpoint-test-step-1",

                  name:
                    "Calculation Step 1",

                  description:
                    "Calculate 10 + 20.",

                  action:
                    "calculate",

                  approved:
                    true,

                  input: {

                    request:
                      "Calculate 10 + 20"

                  }

                }

              );


            if (
              stepOne.success !==
              true
            ) {

              throw new Error(
                "Step 1 creation failed: " +
                JSON.stringify(stepOne)
              );

            }


            if (
              stepOne.step?.status !==
              "pending"
            ) {

              throw new Error(
                "Step 1 should be pending."
              );

            }


            // =================================================
            // ADD STEP 2
            // =================================================

            const stepTwo =
              agentManager.addStep(

                "checkpoint-test-task",

                {

                  id:
                    "checkpoint-test-step-2",

                  name:
                    "Calculation Step 2",

                  description:
                    "Calculate 30 + 40.",

                  action:
                    "calculate",

                  approved:
                    true,

                  input: {

                    request:
                      "Calculate 30 + 40"

                  }

                }

              );


            if (
              stepTwo.success !==
              true
            ) {

              throw new Error(
                "Step 2 creation failed: " +
                JSON.stringify(stepTwo)
              );

            }


            if (
              stepTwo.step?.status !==
              "pending"
            ) {

              throw new Error(
                "Step 2 should be pending."
              );

            }


            console.log(
              "Two test steps created successfully."
            );


            // =================================================
            // VERIFY TASK
            // =================================================

            const liveTask =
              agentManager.getTask(
                "checkpoint-test-task"
              );


            if (
              liveTask.success !==
              true
            ) {

              throw new Error(
                "Live task could not be loaded."
              );

            }


            if (
              liveTask.task?.steps?.length !==
              2
            ) {

              throw new Error(
                "Task should contain exactly two steps."
              );

            }


            if (
              liveTask.task.steps[0].status !==
              "pending"
            ) {

              throw new Error(
                "Step 1 is not pending."
              );

            }


            if (
              liveTask.task.steps[1].status !==
              "pending"
            ) {

              throw new Error(
                "Step 2 is not pending."
              );

            }


            console.log(
              "Live task verification passed."
            );


            // =================================================
            // SAVE BEFORE EXECUTION
            // =================================================

            const before =
              checkpointBridge.saveBeforeExecution(

                "checkpoint-test-task",

                {

                  reason:
                    "Before checkpoint integration execution test.",

                  metadata: {

                    test:
                      "checkpoint-bridge",

                    stage:
                      "before-execution"

                  }

                }

              );


            if (
              before.success !==
              true
            ) {

              throw new Error(
                "Pre-execution checkpoint save failed: " +
                JSON.stringify(before)
              );

            }


            if (
              !before.checkpoint?.id
            ) {

              throw new Error(
                "Pre-execution checkpoint ID is missing."
              );

            }


            if (
              before.checkpoint.recoveryEligible !==
              true
            ) {

              throw new Error(
                "Pre-execution checkpoint should be recoverable."
              );

            }


            if (
              before.checkpoint.pendingSteps !==
              2
            ) {

              throw new Error(
                "Pre-execution checkpoint should contain 2 pending steps."
              );

            }


            if (
              before.checkpoint.totalSteps !==
              2
            ) {

              throw new Error(
                "Pre-execution checkpoint total step count mismatch."
              );

            }


            if (
              before.checkpoint.state !==
              "active"
            ) {

              throw new Error(
                "Pre-execution checkpoint state should be active."
              );

            }


            console.log(
              "Pre-execution checkpoint passed:",
              before.checkpoint.id
            );


            // =================================================
            // LATEST CHECKPOINT
            // =================================================

            const latest =
              checkpointBridge.getLatestCheckpoint(

                "checkpoint-test-task"

              );


            if (
              latest.success !==
              true
            ) {

              throw new Error(
                "Latest checkpoint could not be loaded."
              );

            }


            if (
              latest.checkpoint?.taskId !==
              "checkpoint-test-task"
            ) {

              throw new Error(
                "Latest checkpoint task ID mismatch."
              );

            }


            if (
              latest.checkpoint?.id !==
              before.checkpoint.id
            ) {

              throw new Error(
                "Latest checkpoint ID does not match saved checkpoint."
              );

            }


            if (
              latest.checkpoint?.pendingSteps !==
              2
            ) {

              throw new Error(
                "Latest checkpoint pending count mismatch."
              );

            }


            console.log(
              "Latest checkpoint test passed."
            );


            // =================================================
            // RECOVERY CANDIDATE
            // =================================================

            const candidate =
              checkpointBridge.getRecoveryCandidate(

                "checkpoint-test-task"

              );


            if (
              candidate.success !==
              true
            ) {

              throw new Error(
                "Recovery candidate lookup failed."
              );

            }


            if (
              candidate.recoverable !==
              true
            ) {

              throw new Error(
                "Checkpoint should be recoverable."
              );

            }


            if (
              !candidate.checkpoint?.id
            ) {

              throw new Error(
                "Recovery candidate checkpoint ID missing."
              );

            }


            console.log(
              "Recovery candidate test passed."
            );


            // =================================================
            // RECOVERY PLAN
            // =================================================

            const recoveryPlan =
              checkpointBridge.buildRecoveryPlan(

                "checkpoint-test-task"

              );


            if (
              recoveryPlan.success !==
              true
            ) {

              throw new Error(
                "Recovery plan creation failed."
              );

            }


            if (
              recoveryPlan.recoverable !==
              true
            ) {

              throw new Error(
                "Recovery plan should be recoverable."
              );

            }


            if (
              recoveryPlan.plan?.action !==
              "resume-from-checkpoint"
            ) {

              throw new Error(
                "Recovery plan action mismatch."
              );

            }


            if (
              recoveryPlan.plan?.taskId !==
              "checkpoint-test-task"
            ) {

              throw new Error(
                "Recovery plan task ID mismatch."
              );

            }


            if (
              recoveryPlan.plan?.pendingSteps !==
              2
            ) {

              throw new Error(
                "Recovery plan pending step count mismatch."
              );

            }


            console.log(
              "Recovery plan test passed."
            );


            // =================================================
            // STATE COMPARISON
            // =================================================

            const comparison =
              checkpointBridge.compareWithCheckpoint(

                "checkpoint-test-task"

              );


            if (
              comparison.success !==
              true
            ) {

              throw new Error(
                "Checkpoint comparison failed."
              );

            }


            if (
              comparison.checkpointExists !==
              true
            ) {

              throw new Error(
                "Checkpoint should exist during comparison."
              );

            }


            if (
              comparison.changed !==
              false
            ) {

              throw new Error(
                "Unchanged task should not report drift."
              );

            }


            if (
              !Array.isArray(
                comparison.differences
              )
            ) {

              throw new Error(
                "Comparison differences array is missing."
              );

            }


            if (
              comparison.differences.length !==
              0
            ) {

              throw new Error(
                "Unchanged task should have zero checkpoint differences."
              );

            }


            console.log(
              "State comparison test passed."
            );


            // =================================================
            // TASK INSPECTION
            // =================================================

            const inspection =
              checkpointBridge.inspectTask(

                "checkpoint-test-task"

              );


            if (
              inspection.success !==
              true
            ) {

              throw new Error(
                "Task inspection failed."
              );

            }


            if (
              inspection.task?.id !==
              "checkpoint-test-task"
            ) {

              throw new Error(
                "Inspection task ID mismatch."
              );

            }


            if (
              inspection.checkpointExists !==
              true
            ) {

              throw new Error(
                "Inspection should detect checkpoint."
              );

            }


            if (
              inspection.recoveryCandidate?.recoverable !==
              true
            ) {

              throw new Error(
                "Inspection recovery candidate mismatch."
              );

            }


            if (
              inspection.recoveryPlan?.plan?.action !==
              "resume-from-checkpoint"
            ) {

              throw new Error(
                "Inspection recovery plan mismatch."
              );

            }


            if (
              inspection.comparison?.changed !==
              false
            ) {

              throw new Error(
                "Inspection comparison mismatch."
              );

            }


            console.log(
              "Task inspection test passed."
            );


            // =================================================
            // SAVE AFTER EXECUTION
            // =================================================

            const after =
              checkpointBridge.saveAfterExecution(

                "checkpoint-test-task",

                {

                  success:
                    false,

                  status:
                    "network-error",

                  error:
                    "Temporary test failure.",

                  needsApproval:
                    false,

                  needsInput:
                    false

                },

                {

                  reason:
                    "After controlled checkpoint integration test attempt.",

                  metadata: {

                    stage:
                      "post-execution",

                    test:
                      "checkpoint-bridge"

                  }

                }

              );


            if (
              after.success !==
              true
            ) {

              throw new Error(
                "Post-execution checkpoint save failed: " +
                JSON.stringify(after)
              );

            }


            if (
              !after.checkpoint?.id
            ) {

              throw new Error(
                "Post-execution checkpoint ID is missing."
              );

            }


            if (
              !after.checkpoint?.metadata?.execution
            ) {

              throw new Error(
                "Execution metadata was not stored."
              );

            }


            if (
              after.checkpoint.metadata.execution.success !==
              false
            ) {

              throw new Error(
                "Execution success metadata mismatch."
              );

            }


            if (
              after.checkpoint.metadata.execution.status !==
              "network-error"
            ) {

              throw new Error(
                "Execution status metadata mismatch."
              );

            }


            if (
              after.checkpoint.metadata.execution.error !==
              "Temporary test failure."
            ) {

              throw new Error(
                "Execution error metadata mismatch."
              );

            }


            console.log(
              "Post-execution checkpoint test passed."
            );


            // =================================================
            // CHECKPOINT HISTORY
            // =================================================

            const history =
              checkpointBridge.listCheckpoints(

                "checkpoint-test-task"

              );


            if (
              history.success !==
              true
            ) {

              throw new Error(
                "Checkpoint history lookup failed."
              );

            }


            if (
              history.count !==
              2
            ) {

              throw new Error(
                "Expected exactly two checkpoints, got: " +
                history.count
              );

            }


            if (
              !Array.isArray(
                history.checkpoints
              )
            ) {

              throw new Error(
                "Checkpoint history array is missing."
              );

            }


            if (
              history.checkpoints.length !==
              2
            ) {

              throw new Error(
                "Checkpoint history length mismatch."
              );

            }


            if (
              history.checkpoints[0].id !==
              before.checkpoint.id
            ) {

              throw new Error(
                "First checkpoint history ID mismatch."
              );

            }


            if (
              history.checkpoints[1].id !==
              after.checkpoint.id
            ) {

              throw new Error(
                "Second checkpoint history ID mismatch."
              );

            }


            console.log(
              "Checkpoint history test passed."
            );


            // =================================================
            // GET CHECKPOINT BY ID
            // =================================================

            const fetched =
              checkpointBridge.getCheckpoint(

                after.checkpoint.id

              );


            if (
              fetched.success !==
              true
            ) {

              throw new Error(
                "Checkpoint retrieval by ID failed."
              );

            }


            if (
              fetched.checkpoint?.id !==
              after.checkpoint.id
            ) {

              throw new Error(
                "Checkpoint retrieval ID mismatch."
              );

            }


            console.log(
              "Checkpoint get test passed."
            );


            // =================================================
            // DELETE SINGLE CHECKPOINT
            // =================================================

            const deleteOne =
              checkpointBridge.deleteCheckpoint(

                before.checkpoint.id

              );


            if (
              deleteOne.success !==
              true
            ) {

              throw new Error(
                "Single checkpoint deletion failed."
              );

            }


            const afterSingleDelete =
              checkpointBridge.listCheckpoints(

                "checkpoint-test-task"

              );


            if (
              afterSingleDelete.count !==
              1
            ) {

              throw new Error(
                "Checkpoint count should be 1 after first deletion."
              );

            }


            if (
              afterSingleDelete.checkpoints[0].id !==
              after.checkpoint.id
            ) {

              throw new Error(
                "Remaining checkpoint ID mismatch."
              );

            }


            console.log(
              "Single checkpoint deletion test passed."
            );


            // =================================================
            // DELETE REMAINING TASK CHECKPOINTS
            // =================================================

            const deleteTask =
              checkpointBridge.deleteTaskCheckpoints(

                "checkpoint-test-task"

              );


            if (
              deleteTask.success !==
              true
            ) {

              throw new Error(
                "Task checkpoint deletion failed."
              );

            }


            if (
              deleteTask.deleted !==
              1
            ) {

              throw new Error(
                "Expected one remaining checkpoint to be deleted."
              );

            }


            const afterAllDelete =
              checkpointBridge.listCheckpoints(

                "checkpoint-test-task"

              );


            if (
              afterAllDelete.count !==
              0
            ) {

              throw new Error(
                "All task checkpoints should be deleted."
              );

            }


            console.log(
              "Task checkpoint cleanup passed."
            );


            // =================================================
            // FINAL HEALTH
            // =================================================

            const finalStatus =
              checkpointBridge.getStatus();


            if (
              finalStatus.success !==
              true
            ) {

              throw new Error(
                "Final Checkpoint Bridge health check failed."
              );

            }


            if (
              finalStatus.status !==
              "active"
            ) {

              throw new Error(
                "Final Checkpoint Bridge status is not active."
              );

            }


            if (
              finalStatus.agentManager?.connected !==
              true
            ) {

              throw new Error(
                "Final Agent Manager connection failed."
              );

            }


            if (
              finalStatus.checkpointEngine?.connected !==
              true
            ) {

              throw new Error(
                "Final Checkpoint Engine connection failed."
              );

            }


            if (
              finalStatus.checkpointEngine?.checkpointCount !==
              0
            ) {

              throw new Error(
                "Checkpoint storage should be empty after cleanup."
              );

            }


            // =================================================
            // FINAL SUCCESS
            // =================================================

            console.log("");
            console.log(
              "================================================"
            );
            console.log(
              " AARHEN CHECKPOINT BRIDGE TEST"
            );
            console.log(
              "================================================"
            );
            console.log(
              " Checkpoint Engine Load: PASSED"
            );
            console.log(
              " Checkpoint Bridge Load: PASSED"
            );
            console.log(
              " Bridge Status: PASSED"
            );
            console.log(
              " Agent Creation: PASSED"
            );
            console.log(
              " Task Creation: PASSED"
            );
            console.log(
              " Step Creation: PASSED"
            );
            console.log(
              " Pre-Execution Checkpoint: PASSED"
            );
            console.log(
              " Latest Checkpoint: PASSED"
            );
            console.log(
              " Recovery Candidate: PASSED"
            );
            console.log(
              " Recovery Plan: PASSED"
            );
            console.log(
              " State Comparison: PASSED"
            );
            console.log(
              " Task Inspection: PASSED"
            );
            console.log(
              " Post-Execution Checkpoint: PASSED"
            );
            console.log(
              " Checkpoint History: PASSED"
            );
            console.log(
              " Checkpoint Get: PASSED"
            );
            console.log(
              " Single Deletion: PASSED"
            );
            console.log(
              " Task Cleanup: PASSED"
            );
            console.log(
              " Final Health: PASSED"
            );
            console.log(
              "================================================"
            );
            console.log(
              " CHECKPOINT BRIDGE v5.13.1"
            );
            console.log(
              "================================================"
            );
            console.log(
              " CHECKPOINT BRIDGE READY"
            );
            console.log(
              "================================================"
            );

          })().catch(error => {

            console.error("");
            console.error(
              "CHECKPOINT BRIDGE TEST FAILED"
            );
            console.error(error);
            process.exit(1);

          });

          NODE
